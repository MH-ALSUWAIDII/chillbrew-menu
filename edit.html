<title>Chillbrew Menu Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Patrick+Hand&family=Courier+Prime:wght@400;700&display=swap">
<style>
  :root{
    --paper:#F6F4EF; --ink:#111110; --ink-soft:#57534C; --rule:#CFC9BE;
    --chip:#111110; --chip-ink:#F6F4EF; --shade:rgba(17,17,16,.05); --warn:#8C3B1E;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F0F0E; --ink:#F2EFE7; --ink-soft:#A39D93; --rule:#3A3833;
      --chip:#F2EFE7; --chip-ink:#0F0F0E; --shade:rgba(242,239,231,.06); --warn:#E0A183;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F0F0E; --ink:#F2EFE7; --ink-soft:#A39D93; --rule:#3A3833;
    --chip:#F2EFE7; --chip-ink:#0F0F0E; --shade:rgba(242,239,231,.06); --warn:#E0A183;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Patrick Hand",ui-rounded,system-ui,sans-serif;font-size:18px;line-height:1.5;
  }
  .wrap{max-width:44rem;margin:0 auto;padding:28px 20px 140px}
  h1{font-family:"Gaegu",cursive;font-weight:700;font-size:44px;line-height:.95;margin:0}
  .lede{color:var(--ink-soft);margin:10px 0 0;max-width:52ch}
  .steps{
    margin:22px 0 0;padding:16px 18px;border:2px solid var(--ink);border-radius:12px;background:var(--shade);
  }
  .steps ol{margin:8px 0 0;padding-left:20px}
  .steps li{margin:4px 0}
  code{font-family:"Courier Prime",monospace;font-size:.86em;background:var(--shade);padding:1px 5px;border-radius:4px}

  section.block{margin-top:34px;border-top:2px solid var(--ink);padding-top:14px}
  .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .head input{
    font-family:"Gaegu",cursive;font-weight:700;font-size:30px;line-height:1.1;
    flex:1 1 240px;min-width:0;
  }
  input{
    min-width:0;
    font-family:inherit;font-size:inherit;color:var(--ink);background:transparent;
    border:0;border-bottom:1.5px dashed var(--rule);padding:5px 2px;border-radius:0;
  }
  input:focus{outline:0;border-bottom-color:var(--ink);border-bottom-style:solid}
  .grp-label{
    font-family:"Courier Prime",monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-soft);margin:18px 0 4px;
  }
  .row{display:grid;grid-template-columns:minmax(0,1fr) 4.6rem auto auto auto;gap:6px;align-items:center;padding:5px 0}
  .row .price{font-family:"Courier Prime",monospace;font-variant-numeric:tabular-nums;text-align:right}
  button{
    font-family:"Courier Prime",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink);background:transparent;border:1.5px solid var(--rule);border-radius:999px;
    padding:7px 11px;cursor:pointer;
  }
  button:hover{border-color:var(--ink)}
  button.icon{padding:5px 8px;border-radius:8px;line-height:1}
  @media (max-width:520px){
    .row{grid-template-columns:minmax(0,1fr) 3.6rem auto auto auto;gap:4px}
    .row input{font-size:16px}
    button.icon{padding:4px 6px;font-size:10px}
  }
  button.danger:hover{border-color:var(--warn);color:var(--warn)}
  button.solid{background:var(--chip);color:var(--chip-ink);border-color:var(--chip)}
  button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .add-row{margin-top:10px}

  .savebar{
    position:fixed;left:0;right:0;bottom:0;background:var(--paper);
    border-top:2px solid var(--ink);z-index:3;
  }
  .savebar-in{
    max-width:44rem;margin:0 auto;padding:12px 20px calc(12px + env(safe-area-inset-bottom));
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .status{
    font-family:"Courier Prime",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-soft);margin-right:auto;
  }
  textarea{
    width:100%;min-height:200px;margin-top:14px;font-family:"Courier Prime",monospace;font-size:13px;
    background:var(--shade);color:var(--ink);border:1.5px solid var(--rule);border-radius:10px;padding:12px;
  }
  .hidden{display:none}
</style>

<div class="wrap">
  <h1>Menu editor</h1>
  <p class="lede">Change prices, rename drinks, add or remove items — then press <strong>Publish</strong>. The QR code and the link never change.</p>

  <div class="steps" id="setup">
    <strong>Publishing</strong>
    <div id="setup-state" style="color:var(--ink-soft);margin-top:4px">Checking…</div>
    <div id="setup-form" class="hidden" style="margin-top:12px">
      <p style="margin:0 0 10px">Paste your publish key once. It stays on this phone only — nobody else can publish with it.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input type="password" id="token" placeholder="github_pat_…" autocomplete="off"
               style="flex:1 1 240px;border:1.5px solid var(--rule);border-radius:8px;padding:9px 10px">
        <button type="button" id="save-token" class="solid">Save key</button>
      </div>
    </div>
    <p style="margin:10px 0 0"><button type="button" id="forget" class="hidden">Forget this key</button></p>
  </div>

  <div class="steps" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <div style="margin-right:auto">
      <strong>What the QR shows</strong>
      <div id="mode-label" style="color:var(--ink-soft)">…</div>
    </div>
    <button type="button" id="mode">Switch</button>
  </div>

  <div id="editor"></div>

  <p class="add-row"><button type="button" id="add-section">+ Add section</button></p>

  <textarea id="json" class="hidden" spellcheck="false" aria-label="Raw menu JSON"></textarea>
</div>

<div class="savebar">
  <div class="savebar-in">
    <span class="status" id="status">Loading…</span>
    <button type="button" id="toggle-json">Show JSON</button>
    <button type="button" id="copy">Copy</button>
    <button type="button" id="download">Download</button>
    <button type="button" id="publish" class="solid">Publish</button>
  </div>
</div>

<script>
  let data = null;
  const editor = document.getElementById('editor');
  const status = document.getElementById('status');
  const json   = document.getElementById('json');

  const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const say = msg => { status.textContent = msg; };

  const drawMode = () => {
    const hidden = data.show_menu === false;
    document.getElementById('mode-label').textContent = hidden
      ? 'Only the shop name — the menu is hidden but still saved here'
      : 'The full menu with prices';
    document.getElementById('mode').textContent = hidden ? 'Show the menu' : 'Show name only';
  };

  const draw = () => {
    editor.innerHTML = data.sections.map((sec, si) => `
      <section class="block">
        <div class="head">
          <input value="${esc(sec.title)}" data-path="${si}.title" aria-label="Section title">
          <button type="button" class="icon" data-move-section="${si}" data-dir="-1" title="Move up">↑</button>
          <button type="button" class="icon" data-move-section="${si}" data-dir="1" title="Move down">↓</button>
          <button type="button" class="icon danger" data-del-section="${si}">Delete section</button>
        </div>
        ${sec.groups.map((grp, gi) => `
          <div class="grp-label">${esc(grp.label || 'Items')}</div>
          ${grp.items.map((item, ii) => `
            <div class="row">
              <input value="${esc(item.name)}" data-item="${si}.${gi}.${ii}.name" aria-label="Item name">
              <input class="price" type="number" min="0" step="1" value="${esc(item.price)}" data-item="${si}.${gi}.${ii}.price" aria-label="Price">
              <button type="button" class="icon" data-move="${si}.${gi}.${ii}" data-dir="-1" title="Move up">↑</button>
              <button type="button" class="icon" data-move="${si}.${gi}.${ii}" data-dir="1" title="Move down">↓</button>
              <button type="button" class="icon danger" data-del="${si}.${gi}.${ii}" title="Remove">✕</button>
            </div>`).join('')}
          <p class="add-row"><button type="button" data-add="${si}.${gi}">+ Add item</button></p>
        `).join('')}
      </section>`).join('');
    json.value = JSON.stringify(data, null, 2);
    drawMode();
  };

  const at = path => {
    const [si, gi, ii] = path.split('.').map(Number);
    return { sec: data.sections[si], items: data.sections[si].groups[gi].items, si, gi, ii };
  };

  editor.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.item) {
      const [si, gi, ii, field] = t.dataset.item.split('.');
      const item = data.sections[si].groups[gi].items[ii];
      item[field] = field === 'price' ? Number(t.value) : t.value;
    } else if (t.dataset.path) {
      const [si, field] = t.dataset.path.split('.');
      data.sections[si][field] = t.value;
    }
    json.value = JSON.stringify(data, null, 2);
    say('Unsaved changes — download to publish');
  });

  editor.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.del) {
      const { items, ii } = at(b.dataset.del);
      items.splice(ii, 1);
    } else if (b.dataset.move) {
      const { items, ii } = at(b.dataset.move);
      const to = ii + Number(b.dataset.dir);
      if (to < 0 || to >= items.length) return;
      items.splice(to, 0, items.splice(ii, 1)[0]);
    } else if (b.dataset.add) {
      const [si, gi] = b.dataset.add.split('.').map(Number);
      data.sections[si].groups[gi].items.push({ name: 'New item', price: 0 });
    } else if (b.dataset.delSection) {
      if (!confirm('Delete this whole section?')) return;
      data.sections.splice(Number(b.dataset.delSection), 1);
    } else if (b.dataset.moveSection) {
      const from = Number(b.dataset.moveSection);
      const to = from + Number(b.dataset.dir);
      if (to < 0 || to >= data.sections.length) return;
      data.sections.splice(to, 0, data.sections.splice(from, 1)[0]);
    } else return;
    draw();
    say('Unsaved changes — download to publish');
  });

  document.getElementById('mode').addEventListener('click', () => {
    data.show_menu = data.show_menu === false;
    json.value = JSON.stringify(data, null, 2);
    drawMode();
    say('Unsaved changes — download to publish');
  });

  document.getElementById('add-section').addEventListener('click', () => {
    const id = 'section-' + (data.sections.length + 1);
    data.sections.push({ id, tab: 'New', title: 'New section', note: '', groups: [{ label: '', items: [] }] });
    draw();
    say('Unsaved changes — download to publish');
  });

  document.getElementById('toggle-json').addEventListener('click', e => {
    json.classList.toggle('hidden');
    e.target.textContent = json.classList.contains('hidden') ? 'Show JSON' : 'Hide JSON';
  });

  document.getElementById('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(JSON.stringify(data, null, 2)); say('Copied to clipboard'); }
    catch { json.classList.remove('hidden'); json.select(); say('Select the text and copy it'); }
  });

  document.getElementById('download').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'menu.json';
    a.click();
    URL.revokeObjectURL(a.href);
    say('Downloaded — now upload it to GitHub');
  });

  /* ---- publish straight to the live site ---- */
  const REPO = 'MH-ALSUWAIDII/chillbrew-menu';
  const KEY  = 'chillbrew-publish-key';
  const tokenInput = document.getElementById('token');
  const setupState = document.getElementById('setup-state');
  const setupForm  = document.getElementById('setup-form');
  const forgetBtn  = document.getElementById('forget');
  const publishBtn = document.getElementById('publish');

  const getKey = () => localStorage.getItem(KEY) || '';

  const drawSetup = () => {
    const has = !!getKey();
    setupState.textContent = has
      ? 'Ready — press Publish and the menu updates by itself.'
      : 'Not set up yet. Without a key you can still Download the file and upload it to GitHub by hand.';
    setupForm.classList.toggle('hidden', has);
    forgetBtn.classList.toggle('hidden', !has);
    publishBtn.disabled = !has;
    publishBtn.style.opacity = has ? '1' : '.45';
  };

  document.getElementById('save-token').addEventListener('click', () => {
    const v = tokenInput.value.trim();
    if (!v) return say('Paste the key first');
    localStorage.setItem(KEY, v);
    tokenInput.value = '';
    drawSetup();
    say('Key saved on this device');
  });

  forgetBtn.addEventListener('click', () => {
    localStorage.removeItem(KEY);
    drawSetup();
    say('Key removed from this device');
  });

  const b64 = str => {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
  };

  const api = (path, init = {}) => fetch('https://api.github.com/repos/' + REPO + path, {
    ...init,
    headers: {
      Authorization: 'Bearer ' + getKey(),
      Accept: 'application/vnd.github+json',
      ...(init.headers || {})
    }
  });

  publishBtn.addEventListener('click', async () => {
    if (!getKey()) return say('Set up the publish key first');
    publishBtn.disabled = true;
    say('Publishing…');
    try {
      const head = await api('/contents/menu.json?ref=main');
      if (head.status === 401) throw new Error('The key was refused — make a new one');
      if (!head.ok) throw new Error('Could not read the current menu (' + head.status + ')');
      const { sha } = await head.json();
      const res = await api('/contents/menu.json', {
        method: 'PUT',
        body: JSON.stringify({
          message: 'Update menu from the editor',
          content: b64(JSON.stringify(data, null, 2)),
          sha
        })
      });
      if (res.status === 409) throw new Error('Someone else just changed it — reload and try again');
      if (!res.ok) throw new Error('Publish failed (' + res.status + ')');
      say('Published — live in about a minute');
    } catch (err) {
      say(err.message);
    } finally {
      publishBtn.disabled = !getKey();
    }
  });

  drawSetup();

  fetch('menu.json?v=' + Date.now())
    .then(r => r.json())
    .then(d => { data = d; draw(); say(data.sections.reduce((n, s) => n + s.groups.reduce((m, g) => m + g.items.length, 0), 0) + ' items loaded'); })
    .catch(() => say('Could not load menu.json'));
</script>
