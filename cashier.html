<title>Chillbrew Orders</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Patrick+Hand&family=Courier+Prime:wght@400;700&display=swap">
<style>
  :root{
    --paper:#F6F4EF; --ink:#111110; --ink-soft:#57534C; --rule:#CFC9BE;
    --chip:#111110; --chip-ink:#F6F4EF; --shade:rgba(17,17,16,.05);
    --new:#1F6F4A; --making:#8A6A1F;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F0F0E; --ink:#F2EFE7; --ink-soft:#A39D93; --rule:#3A3833;
      --chip:#F2EFE7; --chip-ink:#0F0F0E; --shade:rgba(242,239,231,.06);
      --new:#7BD3A6; --making:#E3C579;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F0F0E; --ink:#F2EFE7; --ink-soft:#A39D93; --rule:#3A3833;
    --chip:#F2EFE7; --chip-ink:#0F0F0E; --shade:rgba(242,239,231,.06);
    --new:#7BD3A6; --making:#E3C579;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Patrick Hand",ui-rounded,system-ui,sans-serif;font-size:18px;line-height:1.45;
  }
  .bar{
    position:sticky;top:0;z-index:3;background:var(--paper);
    border-bottom:2px solid var(--ink);padding:12px 20px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .mark{font-family:"Gaegu",cursive;font-weight:700;font-size:24px;line-height:1;margin-right:auto}
  .meta{
    font-family:"Courier Prime",monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft);
  }
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--new);margin-right:6px}
  .dot.off{background:var(--rule)}

  .wrap{max-width:60rem;margin:0 auto;padding:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr));gap:14px}

  .card{
    border:2px solid var(--ink);border-radius:14px;padding:14px 16px;background:var(--paper);
    display:flex;flex-direction:column;gap:10px;
  }
  .card.is-new{box-shadow:0 0 0 4px var(--shade)}
  .card.is-done{opacity:.45}
  .card header{display:flex;align-items:baseline;gap:10px}
  .table{font-family:"Gaegu",cursive;font-weight:700;font-size:34px;line-height:1}
  .when{font-family:"Courier Prime",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-left:auto}
  .state{
    font-family:"Courier Prime",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    border:1.5px solid currentColor;border-radius:999px;padding:3px 8px;
  }
  .state.new{color:var(--new)}
  .state.making{color:var(--making)}
  .state.done{color:var(--ink-soft)}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
  li{display:grid;grid-template-columns:2.2rem 1fr auto;gap:8px;align-items:baseline}
  .qty{font-family:"Courier Prime",monospace;font-weight:700;font-variant-numeric:tabular-nums}
  .line{font-family:"Courier Prime",monospace;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .total{
    display:flex;justify-content:space-between;align-items:baseline;
    border-top:1.5px dashed var(--rule);padding-top:8px;
    font-family:"Courier Prime",monospace;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  }
  .total b{font-family:"Gaegu",cursive;font-size:24px;letter-spacing:0}
  .acts{display:flex;gap:8px}
  button{
    font-family:"Courier Prime",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    padding:9px 13px;border-radius:999px;cursor:pointer;
    border:1.5px solid var(--ink);background:transparent;color:var(--ink);
  }
  button.solid{background:var(--chip);color:var(--chip-ink);border-color:var(--chip)}
  button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

  .setup{max-width:32rem;margin:12vh auto;padding:24px 20px;text-align:center}
  .setup h1{font-family:"Gaegu",cursive;font-weight:700;font-size:44px;margin:0 0 6px}
  .setup p{color:var(--ink-soft);margin:0 0 20px}
  .setup input{
    width:100%;margin-bottom:10px;font-family:"Courier Prime",monospace;font-size:15px;
    color:var(--ink);background:transparent;border:1.5px solid var(--rule);border-radius:10px;padding:11px 12px;
  }
  .empty{color:var(--ink-soft);padding:40px 0;text-align:center}
  .hidden{display:none}
</style>

<div id="setup" class="setup hidden">
  <h1>Orders</h1>
  <p>Connect this screen to the order service. It only has to be done once on this device.</p>
  <input id="in-base" value="https://menu.ma6.ae/api/orders.php" autocomplete="off" inputmode="url">
  <input id="in-key" type="password" placeholder="Cashier password" autocomplete="off">
  <button class="solid" id="connect">Connect</button>
  <p id="setup-msg" style="margin-top:14px"></p>
</div>

<div id="app" class="hidden">
  <div class="bar">
    <span class="mark">chillbrew</span>
    <span class="meta" id="live"><span class="dot" id="dot"></span><span id="live-text">Live</span></span>
    <button id="sound">Sound on</button>
    <button id="signout">Disconnect</button>
  </div>
  <div class="wrap">
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty">No orders yet today.</p>
  </div>
</div>

<script>
  const KEYS = { base: 'chillbrew-orders-base', key: 'chillbrew-orders-key', sound: 'chillbrew-orders-sound' };
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  let base = localStorage.getItem(KEYS.base) || 'https://menu.ma6.ae/api/orders.php';
  let key  = localStorage.getItem(KEYS.key) || '';
  let soundOn = localStorage.getItem(KEYS.sound) !== 'off';
  let seen = new Set();
  let firstLoad = true;

  const show = () => {
    const ready = base && key;
    $('setup').classList.toggle('hidden', ready);
    $('app').classList.toggle('hidden', !ready);
    if (ready) poll();
  };

  $('connect').addEventListener('click', async () => {
    const b = $('in-base').value.trim().replace(/\/+$/, '');
    const k = $('in-key').value.trim();
    if (!b || !k) return $('setup-msg').textContent = 'Fill both fields.';
    $('setup-msg').textContent = 'Checking…';
    try {
      const res = await fetch(b + '?key=' + encodeURIComponent(k));
      if (res.status === 401) return $('setup-msg').textContent = 'Wrong password.';
      if (!res.ok) throw new Error();
      base = b; key = k;
      localStorage.setItem(KEYS.base, b);
      localStorage.setItem(KEYS.key, k);
      $('setup-msg').textContent = '';
      show();
    } catch {
      $('setup-msg').textContent = 'Could not reach that address.';
    }
  });

  $('signout').addEventListener('click', () => {
    localStorage.removeItem(KEYS.base);
    localStorage.removeItem(KEYS.key);
    base = key = '';
    show();
  });

  const drawSound = () => { $('sound').textContent = soundOn ? 'Sound on' : 'Sound off'; };
  $('sound').addEventListener('click', () => {
    soundOn = !soundOn;
    localStorage.setItem(KEYS.sound, soundOn ? 'on' : 'off');
    drawSound();
    if (soundOn) beep();
  });
  drawSound();

  let audio;
  function beep() {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const now = audio.currentTime;
      [880, 1174].forEach((freq, i) => {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.frequency.value = freq;
        osc.connect(gain).connect(audio.destination);
        gain.gain.setValueAtTime(0.0001, now + i * 0.18);
        gain.gain.exponentialRampToValueAtTime(0.25, now + i * 0.18 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.18 + 0.22);
        osc.start(now + i * 0.18);
        osc.stop(now + i * 0.18 + 0.24);
      });
    } catch { /* audio is a nicety, never a blocker */ }
  }

  const ago = iso => {
    const mins = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + ' min ago';
    return Math.floor(mins / 60) + ' h ago';
  };

  const card = o => `
    <article class="card ${o.status === 'new' ? 'is-new' : ''} ${o.status === 'done' ? 'is-done' : ''}">
      <header>
        <span class="table">Table ${esc(o.table_no)}</span>
        <span class="state ${esc(o.status)}">${o.status === 'making' ? 'preparing' : esc(o.status)}</span>
        <span class="when">${ago(o.placed_at)}</span>
      </header>
      <ul>
        ${o.items.map(i => `<li><span class="qty">${i.qty}&times;</span><span>${esc(i.name)}</span><span class="line">${i.price * i.qty}</span></li>`).join('')}
      </ul>
      <div class="total"><span>Total</span><b>${o.total} AED</b></div>
      <div class="acts">
        ${o.status !== 'done' ? `<button data-id="${esc(o.id)}" data-status="${o.status === 'new' ? 'making' : 'done'}" class="solid">${o.status === 'new' ? 'Start' : 'Done'}</button>` : ''}
        ${o.status !== 'new' && o.status !== 'done' ? `<button data-id="${esc(o.id)}" data-status="new">Back</button>` : ''}
      </div>
    </article>`;

  const draw = orders => {
    $('grid').innerHTML = orders.map(card).join('');
    $('empty').style.display = orders.length ? 'none' : '';
  };

  $('grid').addEventListener('click', async e => {
    const b = e.target.closest('button');
    if (!b) return;
    b.disabled = true;
    await fetch(base + '?action=status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, id: b.dataset.id, status: b.dataset.status })
    });
    poll();
  });

  async function poll() {
    if (!base || !key) return;
    try {
      const res = await fetch(base + '?key=' + encodeURIComponent(key));
      if (!res.ok) throw new Error();
      const { orders } = await res.json();
      const fresh = orders.filter(o => o.status === 'new' && !seen.has(o.id));
      orders.forEach(o => seen.add(o.id));
      if (fresh.length && !firstLoad) beep();
      firstLoad = false;
      draw(orders);
      $('dot').classList.remove('off');
      $('live-text').textContent = 'Live';
    } catch {
      $('dot').classList.add('off');
      $('live-text').textContent = 'Offline — retrying';
    }
  }

  setInterval(poll, 5000);
  show();
</script>
